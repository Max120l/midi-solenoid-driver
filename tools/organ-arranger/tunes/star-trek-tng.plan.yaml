# Plan for organ_transcribe: Star Trek: The Next Generation, main title (Goldsmith).
# Track names are the sequencer's credits. "Star Trek" (and its duplicate,
# "Copyright (c)") is the piano-style reduction: its top line is the theme
# and goes on Melody with fast alternations held as tremolos. "Sequenced" is
# the high horn line, on TrebCM; the two sparse high figures ("pennock@",
# "Paramount") join it there. "Generation" is the string pad, top line on
# TenorCM; "Track 5" is the low sustained chords, top line on Accompaniment;
# "The Next" is the bass, on the Base rank with spill-over. "Cliff Pennock" is
# glissando runs, unplayable on pipes, dropped. The little drum track is a
# snare roll at the end.
transpose: 2
# Bars 77-80 (78.6-82.8 s) lift into C sharp major, a key with three pitch
# classes the organ lacks; snapped note by note the ranks disagreed and the
# passage sounded off. Shifted down one, every voice together, it is C major
# on real pipes; bar 81 returns to D and the shift ends there.
shifts:
- {from: 78.6, until: 82.76, shift: -1}
voices:
- {source: 'Star Trek#1', rank: Melody, role: melody, max_poly: 1, weight: 3.0, tremolo: 100}
- {source: 'Copyright (c)#9', rank: drop}
- {source: 'Sequenced#5', rank: TrebCM, role: counter, max_poly: 1, weight: 1.5}
- {source: 'pennock@euronet.nl#8', rank: TrebCM, role: counter, max_poly: 1, weight: 1.0}
- {source: 'Paramount Pictures#10', rank: TrebCM, role: counter, max_poly: 1, weight: 1.0}
# The string figure is staccato chords, five deep, six a second, over three
# octaves. Up to bar 60 its top line on the tenor reads as texture; after
# that the writing thickens and it turned to mud, so from 61 s it keeps at most
# two onsets per beat (170 ms at 174; one per beat was bare) and nothing is hauled up
# more than an octave to reach the tenor.
- {source: 'Generation#3', rank: TenorCM, role: accomp, max_poly: 1, weight: 1.0, until: 61}
- {source: 'Generation#3', rank: TenorCM, role: accomp, max_poly: 1, weight: 1.0, from: 61, min_gap: 170, max_fold: 1}
- {source: 'Track 5#4', rank: Accompainment, role: accomp, max_poly: 1, weight: 1.0}
- {source: 'The Next#2', rank: 'Accompainment:Base', role: bass, max_poly: 1, weight: 2.0, fallback: Accompainment}
- {source: 'Cliff Pennock#7', rank: drop}
- {source: '& AWE arrangement:#6', rank: drop}
- {source: 'Track 12#11', rank: drop}
drums:
  source: 'Track 13#12'
  map: {35: bass, 36: bass, 38: snare, 40: snare, 37: snare, 39: snare}
  leader: downbeat
  # The file's only drums are the snare roll at the very end. A written part
  # (bass on one, snare on three from the theme's entrance) was tried and did
  # not sit with the music; a source with a real drum track is the answer.
registration:
- at: start
  'on': [Trombone Base, Clarinet TenorCM, Cello TenorCM, Violin Accompainment, Flute Melody, Trumpet Melody, Violin Melody]
