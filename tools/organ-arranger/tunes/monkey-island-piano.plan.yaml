# Plan for organ_transcribe: The Secret of Monkey Island, opening theme -- the
# simple two-hand piano version. Right hand on Melody, with fast two-note
# alternations held as tremolos. Left hand split: its bass notes (G2 and
# below, octave doublings thinned to the lower note) on the Base rank with
# spill-over; everything above on TenorCM as a single arpeggiated line -- the
# clarinet pipes take the marimba's job from the band version.
transpose: 5
voices:
- {source: 'Piano#0', rank: 'Main:Melody', role: melody, max_poly: 1, weight: 3.0, tremolo: 100}
- {source: 'Piano#1', rank: 'Main:Base', role: bass, max_poly: 1, weight: 2.0, fallback: 'Main:Accompainment', highest: 43}
- {source: 'Piano#1', rank: TenorCM, role: accomp, max_poly: 1, weight: 1.5, lowest: 44}
drums:
  source: null
  map: {}
  leader: downbeat
registration:
- at: start
  'on': [Trombone Base, Clarinet TenorCM, Cello TenorCM, Violin Accompainment, Flute Melody, Trumpet Melody, Violin Melody]
