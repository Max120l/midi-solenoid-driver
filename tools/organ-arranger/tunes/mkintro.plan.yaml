# Plan for organ_transcribe: the Monkey Island intro theme (mkintro.mid).
#
# transpose is fixed at -2 (D minor). The scorer rates A minor (+5) and D minor
# within a few tenths of a percent of each other -- both lose only the raised
# leading tone -- and D minor won the listening test on the pipes: fewer bass
# notes spill off the four-pipe Base rank, and it sits a fourth lower.
#
# The source .mid is not in the repository; keep it alongside this file when
# rebuilding:
#   organ_transcribe.py mkintro.mid --organ ../instrument/organ.yaml --plan mkintro.plan.yaml
#   organ_arranger.py mkintro.fororgan.mid --organ ../instrument/organ.yaml
#
# rank: one of the ranks the report lists, or 'drop'. role: melody | bass |
# counter | accomp. fallback: a second rank to spill to.
transpose: -2
voices:
- {source: Picked Bs.#4, rank: 'Main:Base', role: bass, max_poly: 1, weight: 2.0,
  fallback: 'Main:Accompainment'}
# The steel drum's fast two-note alternations (bars 28-31 and elsewhere) are
# tremolos; faster than 100 ms they are held as the pair instead of hammered.
# This version, with Organ 2 sitting out the run-up to the break, is the keeper;
# the 1997 band file and the two-hand piano version were tried and retired.
- {source: Steel Drums#1, rank: 'Main:Melody', role: melody, max_poly: 1, weight: 3.0, tremolo: 100}
- {source: Marimba#5, rank: TenorCM, role: accomp, max_poly: 3, weight: 1.0}
- {source: Organ 1#7, rank: 'Main:Accompainment', role: accomp, max_poly: 3, weight: 1.0}
# Organ 2 is the counter riff on TrebCM. In the run-up to the break (54-79 s)
# it peaks at once with the melody's fast run and the marimba, and the whole
# thing was too busy; it sits that stretch out. The marimba on TenorCM (the
# clarinet pipes) stays whole: it sounds wonderful there.
- {source: Organ 2#2, rank: TrebCM, role: counter, max_poly: 1, weight: 1.0, until: 54}
- {source: Organ 2#2, rank: TrebCM, role: counter, max_poly: 1, weight: 1.0, from: 79}
- {source: Steel Drums#6, rank: TrebCM, role: counter, max_poly: 2, weight: 1.0}
- {source: Piano#3, rank: TenorCM, role: counter, max_poly: 2, weight: 1.0}
- {source: Steel Drums#9, rank: TenorCM, role: counter, max_poly: 2, weight: 1.0}
drums:
  source: Drums#10
  map: {35: bass, 36: bass, 38: snare, 40: snare, 37: snare}
  leader: downbeat
registration:
- at: start
  'on': [Clarinet TenorCM, Cello TenorCM, Violin Accompainment, Flute Melody]
- at: melody
  'on': [Trombone Base, Trumpet Melody, Violin Melody]
