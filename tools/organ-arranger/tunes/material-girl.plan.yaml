# Plan for organ_transcribe: Madonna, Material Girl (General MIDI file, unnamed tracks;
# each track also carries a stray channel 16, so sources are named per channel).
# Two ranks installed. Track 5 (ch3) is the vocal line, an octave C4-C5, and
# goes on Melody; Track 4 (ch2) is the synth hook that plays whenever the
# voice rests, so it shares the Melody rank at lower priority. Track 3 (ch1)
# is the synth bass and goes on Accompaniment. The chord stabs (tracks 12 and
# 13, identical), the chorus synth doubling (6, 7) and the fills are dropped:
# nine accompaniment pipes cannot hold a bass line and chords at once.
transpose: 0
voices:
- {source: Track 5#4/ch4, rank: Melody, role: melody, max_poly: 1, weight: 3.0}
- {source: Track 4#3/ch3, rank: Melody, role: counter, max_poly: 1, weight: 1.5}
- {source: Track 3#2/ch2, rank: 'Accompainment:Base', role: bass, max_poly: 1, weight: 2.0, fallback: Accompainment}
- {source: Track 6#5/ch5, rank: TrebCM, role: counter, max_poly: 1, weight: 1.0}
- {source: Track 7#6/ch6, rank: drop}
- {source: Track 8#7/ch7, rank: drop}
- {source: Track 9#8/ch8, rank: drop}
- {source: Track 10#9/ch9, rank: drop}
- {source: Track 12#11/ch11, rank: TenorCM, role: accomp, max_poly: 2, weight: 1.0}
- {source: Track 13#12/ch12, rank: drop}
- {source: Track 14#13/ch13, rank: drop}
drums:
  source: Track 11#10/ch10
  map: {36: bass, 35: bass, 38: snare, 40: snare, 37: snare, 39: snare}
  leader: downbeat
registration:
- at: start
  'on': [Clarinet TenorCM, Cello TenorCM, Violin Accompainment, Flute Melody, Trumpet Melody, Violin Melody]
