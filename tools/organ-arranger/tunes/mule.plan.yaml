# Plan for organ_transcribe: M.U.L.E. theme (Roy Glover, 1983), from a
# three-track GM file: bass, a guitar melody in the tenor register, drums.
# The tune goes to the Melody rank an octave up and to TenorCM at written
# pitch, where the guitar actually sits; the treble takes a third above.
# The bass stays on the four Base pipes with spill-over to the accompaniment.
transpose: -3
voices:
- {source: Bass#1, rank: 'Accompainment:Base', role: bass, max_poly: 1, weight: 2.0, fallback: Accompainment}
- {source: Melody#2, rank: Melody, role: melody, max_poly: 1, weight: 3.0}
- {source: Melody#2, rank: TenorCM, role: counter, max_poly: 1, weight: 1.5}
- {source: Melody#2, rank: TrebCM, role: counter, max_poly: 1, weight: 1.0, derive: thirds}
drums:
  source: Percussion#3
  map: {35: bass, 36: bass, 38: snare, 40: snare, 37: snare}
  leader: downbeat
registration:
- at: start
  'on': [Clarinet TenorCM, Cello TenorCM, Violin Accompainment, Flute Melody]
- at: melody
  'on': [Trombone Base, Trumpet Melody, Violin Melody]
