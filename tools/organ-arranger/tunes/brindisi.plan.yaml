# Plan for organ_transcribe: Verdi, Brindisi (Libiamo) from La Traviata.
# The file carries the tune four times ("Sequenced by", "Bazza1 2010", "North
# Adelaide", "South Australia" -- the sequencer's credits used as track names)
# and the chords twice; one copy of each is used. The tune goes on Melody, the
# second voice ("Verdi- Brindisi") on TenorCM, the chorus ("La Traviata") as a
# top line on TrebCM, the waltz chords as a top line on Accompaniment, and the
# bass (Track 12) on the Base rank with spill-over. No drums in the file, so
# the leader marks the downbeats alone.
transpose: -5
voices:
- {source: 'Sequenced by#4', rank: Melody, role: melody, max_poly: 1, weight: 3.0, tremolo: 100}
# From 140 s the tenor and the chorus double the tune in unison, 6-18 ms early
# with tens of ms of scatter -- a flam on pipes. align snaps them to the lead.
- {source: 'Verdi- Brindisi#2', rank: TenorCM, role: counter, max_poly: 1, weight: 1.5, align: 40}
- {source: 'La Traviata#3', rank: TrebCM, role: accomp, max_poly: 1, weight: 1.0, align: 40}
- {source: 'Bazza1Studios®#6', rank: Accompainment, role: accomp, max_poly: 1, weight: 1.0}   # the track name ends in a registered sign
- {source: 'Track 12#11', rank: 'Accompainment:Base', role: bass, max_poly: 1, weight: 2.0, fallback: Accompainment}
- {source: 'Bazza1  2010#5', rank: drop}
- {source: 'North Adelaide#7', rank: drop}
- {source: 'South Australia#8', rank: drop}
- {source: 'Track 10#9', rank: drop}
- {source: 'Track 11#10', rank: drop}
- {source: 'Track 13#12', rank: drop}
drums:
  source: null
  map: {}
  leader: downbeat
registration:
- at: start
  'on': [Trombone Base, Clarinet TenorCM, Cello TenorCM, Violin Accompainment, Flute Melody, Trumpet Melody, Violin Melody]
