# Plan for organ_transcribe: Over the Waves (Rosas) -- from a MIDI arranged for
# a Wurlitzer 125 band organ roll (Schmidt's Music Rolls). One track, real
# pitches, punched-roll style: short notes, melody doubled at the octave,
# chords in the accompaniment. Split by pitch into the roll's own layers:
# bass (F2 and below) on the Base rank with spill-over; the accompaniment
# chords (G2-B3) on Accompaniment, two notes deep; the melody (top note of
# everything from C4 up) on Melody; the melody's lower octave (C4-B4) on
# TenorCM and its middle voice (C5-B5) on TrebCM. No drums in the file. The
# track inside the file is named "Deck the Halls" -- the roll maker's template.
transpose: 5
voices:
- {source: 'Deck the Halls#0', rank: 'Main:Melody', role: melody, max_poly: 1, weight: 3.0, lowest: 60, tremolo: 100}
- {source: 'Deck the Halls#0', rank: TrebCM, role: counter, max_poly: 1, weight: 1.0, lowest: 72, highest: 83}
- {source: 'Deck the Halls#0', rank: TenorCM, role: counter, max_poly: 1, weight: 1.0, lowest: 60, highest: 71}
- {source: 'Deck the Halls#0', rank: 'Main:Accompainment', role: accomp, max_poly: 2, weight: 1.0, lowest: 43, highest: 59}
- {source: 'Deck the Halls#0', rank: 'Main:Base', role: bass, max_poly: 1, weight: 2.0, fallback: 'Main:Accompainment', highest: 41}
drums:
  source: null
  map: {}
  leader: downbeat
registration:
- at: start
  'on': [Trombone Base, Clarinet TenorCM, Cello TenorCM, Violin Accompainment, Flute Melody, Trumpet Melody, Violin Melody]
