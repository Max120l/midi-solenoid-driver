# Plan for organ_transcribe: Star Trek, the original series theme (Courage),
# from a one-track GM file with nine channels: pad (ch2), electric piano
# (ch3), horn (ch4), piccolo (ch5), clarinet (ch6, doubling the piccolo),
# two trumpets (ch7, ch8), strings (ch9), a jazz kit (ch10).
# Shape: a slow opening to bar 9 (the horn call, bars 3-8), a piccolo
# flourish into the swing theme at bar 11, the trumpets' statement from
# bar 17, a minute in all.
# Two keys: the swing sits best four semitones up (434 of 466 notes on
# pipes); the opening sits best four down, where the horn call loses only
# two notes of twenty-one instead of six. So +4 overall, and the opening
# up to 30 s, where the piccolo flourish into the swing begins, shifted eight back on top.
transpose: 4
shifts:
- {until: 30, shift: -8}
voices:
# the lead -- the horn call in the opening, the trumpet from the flourish on --
# sits on the tenor: its register, and the tenor has the F sharp the tune
# leans on. The piccolo riff goes up to the Melody rank, where a piccolo
# belongs, no faster than the pipes can speak.
- {source: 'Track 1#0/ch4', rank: TenorCM, role: melody, max_poly: 1, weight: 3.0, until: 30, max_fold: 2}
- {source: 'Track 1#0/ch7', rank: TenorCM, role: melody, max_poly: 1, weight: 3.0, from: 30, until: 38.3, max_fold: 2}
# from bar 13 (38.3 s) the trumpet's fast runs were terrible on the tenor;
# instead the tenor doubles the treble's material -- the piano's top line and
# the strings -- an octave down, and the trumpet is silent
- {source: 'Track 1#0/ch3', rank: TenorCM, role: counter, max_poly: 1, weight: 1.0, from: 38.3, max_fold: 2}
- {source: 'Track 1#0/ch9', rank: TenorCM, role: counter, max_poly: 1, weight: 1.0, from: 38.3, max_fold: 2}
- {source: 'Track 1#0/ch5', rank: Melody, role: counter, max_poly: 1, weight: 1.5, min_gap: 100, max_fold: 2}
# harmony on the accompaniment: the pad in the opening, horn pads and the
# second trumpet's stabs in the swing; walking bass on the Base pipes
- {source: 'Track 1#0/ch2', rank: Accompainment, role: accomp, max_poly: 1, weight: 1.0, until: 30, max_fold: 2}
- {source: 'Track 1#0/ch4', rank: Accompainment, role: accomp, max_poly: 1, weight: 1.0, from: 30, max_fold: 1}
- {source: 'Track 1#0/ch8', rank: Accompainment, role: accomp, max_poly: 1, weight: 1.0, max_fold: 2}
- {source: 'Track 1#0/ch2', rank: 'Accompainment:Base', role: bass, max_poly: 1, weight: 2.0, fallback: Accompainment, from: 30, max_fold: 2}
# the piano's top line and the strings, sparse, on the treble
- {source: 'Track 1#0/ch3', rank: TrebCM, role: counter, max_poly: 1, weight: 1.0, max_fold: 2}
- {source: 'Track 1#0/ch9', rank: TrebCM, role: counter, max_poly: 1, weight: 1.0, max_fold: 2}
- {source: 'Track 1#0/ch6', rank: drop}
drums:
  # the jazz kit (ride on the snare, toms on the bass drum) was tried and was
  # just bad; no drums, only the leader on the downbeats
  source: null
  map: {}
  leader: downbeat
registration:
- at: start
  'on': [Clarinet TenorCM, Cello TenorCM, Violin Accompainment, Flute Melody]
- at: melody
  'on': [Trombone Base, Trumpet Melody, Violin Melody]
