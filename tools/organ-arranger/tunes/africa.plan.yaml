# Plan for organ_transcribe: Toto, Africa.
# The vocals go on Melody. The famous synth riff (Track 6) plays the intro,
# the interlude and the outro and takes the Melody rank there; the flute
# carries the bridge. Track 3 is the bass, on the Base rank with spill-over
# to Accompaniment. The keyboard chords ("AFRICA #"), the flute harmony and
# the small parts are dropped until more ranks are in. Track 11 is the
# whole drum kit; the per-drum tracks that follow it are the same hits
# again, so only Track 11 is used.
transpose: -4
voices:
- {source: 'vocals#4', rank: 'Main:Melody', role: melody, max_poly: 1, weight: 3.0}
- {source: 'Track 6#5', rank: 'Main:Melody', role: counter, max_poly: 1, weight: 1.5, until: 40}
- {source: 'Track 6#5', rank: 'Main:Melody', role: counter, max_poly: 1, weight: 1.5, from: 95, until: 115}
- {source: 'Track 6#5', rank: 'Main:Melody', role: counter, max_poly: 1, weight: 1.5, from: 215}
- {source: 'Flute (Bridge)#6', rank: 'Main:Melody', role: counter, max_poly: 1, weight: 2.0, from: 165, until: 195}
- {source: 'Track 3#2', rank: 'Main:Base', role: bass, max_poly: 1, weight: 2.0, fallback: 'Main:Accompainment'}
- {source: 'AFRICA  ##1', rank: TenorCM, role: accomp, max_poly: 1, weight: 1.0}
- {source: 'Track 4#3', rank: drop}
- {source: 'Flute Harmony (Bridge)#7', rank: TenorCM, role: counter, max_poly: 1, weight: 1.5, from: 165, until: 195}
- {source: 'Track 9#8', rank: drop}
- {source: 'Track 10#9', rank: drop}
drums:
  source: 'Track 11#10'
  map: {35: bass, 36: bass, 38: snare, 40: snare, 37: snare, 39: snare}
  leader: downbeat
registration:
- at: start
  'on': [Clarinet TenorCM, Cello TenorCM, Trombone Base, Violin Accompainment, Flute Melody, Trumpet Melody, Violin Melody]
