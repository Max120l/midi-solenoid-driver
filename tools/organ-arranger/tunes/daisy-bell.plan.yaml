# Plan for organ_transcribe: Daisy Bell (Bicycle Built for Two).
# The square-wave tune on Melody. The piano is an oom-pah: its beat-one bass
# notes (D3 and below) go to the Base rank with spill-over, the chords above
# them to Accompaniment. The sine descant would sit on top of
# the tune on the same 13 pipes, so it is dropped for now.
transpose: 0
voices:
- {source: 8-Bit Square#1, rank: Melody, role: melody, max_poly: 1, weight: 3.0}
- {source: Grand Piano (Classic)#0, rank: 'Accompainment:Base', role: bass, max_poly: 1, weight: 2.0, fallback: Accompainment, highest: 50}
- {source: Grand Piano (Classic)#0, rank: Accompainment, role: accomp, max_poly: 2, weight: 1.0, lowest: 51}
- {source: 8-Bit Sine#2, rank: TrebCM, role: counter, max_poly: 1, weight: 1.0}
drums:
  source: null
  map: {}
  leader: downbeat
registration:
- at: start
  'on': [Clarinet TenorCM, Cello TenorCM, Violin Accompainment, Flute Melody, Violin Melody]
