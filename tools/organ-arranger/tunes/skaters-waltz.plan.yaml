# Plan for organ_transcribe: Waldteufel, The Skaters' Waltz -- from a MIDI arranged for a
# Wurlitzer 125 band organ roll (Schmidt's Music Rolls): one track, real
# pitches, punched-roll style. Split by pitch into the roll's layers, as for
# Over the Waves: bass on the Base rank with spill-over, accompaniment chords
# on Accompaniment two deep, the top melody note on Melody. No drums in the file.
# The track's own name inside the file is the roll maker's template.
transpose: 5
voices:
- {source: 'Deck the Halls#0', rank: Melody, role: melody, max_poly: 1, weight: 3.0, lowest: 60, tremolo: 100}
# Counter lines made from the material rather than copied: the treble plays the
# tune's top line a diatonic third above; the tenor arpeggiates the
# accompaniment chords, one chord tone per eighth, an inner line in motion.
- {source: 'Deck the Halls#0', rank: TrebCM, role: counter, max_poly: 1, weight: 1.0, lowest: 60, derive: thirds}
- {source: 'Deck the Halls#0', rank: TenorCM, role: counter, max_poly: 1, weight: 1.0, lowest: 43, highest: 59, derive: arpeggio, derive_step: 0.5}
- {source: 'Deck the Halls#0', rank: Accompainment, role: accomp, max_poly: 2, weight: 1.0, lowest: 43, highest: 59}
- {source: 'Deck the Halls#0', rank: 'Accompainment:Base', role: bass, max_poly: 1, weight: 2.0, fallback: Accompainment, highest: 41}
drums:
  source: null
  map: {}
  leader: downbeat
registration:
- at: start
  'on': [Trombone Base, Clarinet TenorCM, Cello TenorCM, Violin Accompainment, Flute Melody, Trumpet Melody, Violin Melody]
