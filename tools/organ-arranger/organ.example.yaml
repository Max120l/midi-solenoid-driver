# EXAMPLE organ definition -- replace every mapping below with your own.
#
# This file is the only place the instrument's identity lives. Every value on
# the right-hand side of a mapping is an OUTPUT SLOT: the MIDI note number the
# driver boards listen for. Under OFFSET_COARSE3 with four boards at base
# notes 48, 64, 80 and 96, the slots are 48-111 -- board 1 output 1 is slot 48,
# board 4 output 16 is slot 111.
#
# The example below is a plausible 64-slot layout and nothing more:
#   slots  48- 87   forty chromatic pipes, C3 to G6
#   slots  88- 93   six percussion
#   slots  96-109   seven registers, two slots each
# Slots 94, 95, 110, 111 spare.

name: Example band organ

# MIDI channel (1-16) every output note is written on. The boards are built
# with fixedChannel = 1.
output_channel: 1

# Score pitch -> slot. The key is the note as written in the DAW; the value is
# which slot sounds it. Pitches that are not listed are dropped and reported.
# Several pitches may share one slot if you want a substitute pipe; nothing
# else may share a slot with anything.
pitches:
  48: 48    # C3
  49: 49
  50: 50
  51: 51
  52: 52
  53: 53
  54: 54
  55: 55
  56: 56
  57: 57
  58: 58
  59: 59
  60: 60    # C4, middle C
  61: 61
  62: 62
  63: 63
  64: 64
  65: 65
  66: 66
  67: 67
  68: 68
  69: 69
  70: 70
  71: 71
  72: 72    # C5
  73: 73
  74: 74
  75: 75
  76: 76
  77: 77
  78: 78
  79: 79
  80: 80
  81: 81
  82: 82
  83: 83
  84: 84    # C6
  85: 85
  86: 86
  87: 87    # G6

# GM drum note on channel 10 -> slot. Each hit becomes a fixed-length pulse
# regardless of how long the note was drawn.
percussion:
  36: 88    # bass drum
  38: 89    # snare
  42: 90    # closed hi-hat  (wood block, say)
  49: 91    # crash cymbal
  51: 92    # ride cymbal
  56: 93    # cowbell

# Registers are set/reset latches: one pulse to the "set" coil opens the
# register, one to the "reset" coil closes it. In the DAW, draw a note on the
# register track spanning the section the register should be engaged for.
#
# Which track is the register track: any track whose name contains this text,
# case-insensitively. (Alternatively `register_channel: N` picks by channel.)
register_track: Registers

# Note on the register track -> which register. The key is the note number you
# draw in the DAW; the name is only for the report.
registers:
  60: { name: Register 1, set: 96,  reset: 97  }
  61: { name: Register 2, set: 98,  reset: 99  }
  62: { name: Register 3, set: 100, reset: 101 }
  63: { name: Register 4, set: 102, reset: 103 }
  64: { name: Register 5, set: 104, reset: 105 }
  65: { name: Register 6, set: 106, reset: 107 }
  66: { name: Register 7, set: 108, reset: 109 }

# All in milliseconds. These are starting points to tune against the chest.
timing:
  min_note_ms: 50            # shorter pitched notes are stretched to this
  min_gap_ms: 30             # silence needed between two notes on one slot
  percussion_pulse_ms: 50    # how long a drum solenoid is driven per hit
  register_pulse_ms: 100     # how long a register coil is pulsed
  register_stagger_ms: 60    # spacing between register pulses in the preamble
  lead_in_ms: 1000           # silence before the music, after the preamble
  settle_ms: 250             # pause after the last note before the postamble
  reset_registers_at_start: true   # pulse every reset first, so state is known
  reset_registers_at_end: true     # and leave everything closed afterwards
