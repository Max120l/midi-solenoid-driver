# EXAMPLE organ definition -- a placeholder layout, not a real instrument.
#
# In practice this file is GENERATED from the layout spreadsheet by
# layout_to_organ.py; this example exists to show the shape. Every slot value
# is the MIDI note the driver boards listen for. With four boards under
# OFFSET_COARSE3 at base notes 48, 64, 80 and 96, solenoid N is slot 48 + N - 1.
#
# The organising idea: the mapping is PER TRACK. On a band organ the same note
# number on a different track is a different pipe -- Main 60 and TenorCM 60
# are two different solenoids -- so each DAW track carries its own map.

name: Example band organ

# MIDI channel (1-16) every output note is written on. The boards are built
# with fixedChannel = 1.
output_channel: 1

tracks:
  # A pitched track keeps each note's written duration.
  Main:
    kind: pitched
    notes:           # note as written on this track -> slot it sounds
      48: 60
      50: 61
      52: 62
      53: 63
      55: [64, 65]   # one note may sound two pipes: a doubled rank
      57: 66
      59: 67
      60: 68

  TenorCM:
    kind: pitched
    notes:
      60: 70         # same note number as Main 60, different pipe
      62: 71
      64: 72

  # A pulse track treats every note as a strike of fixed length, whatever was
  # drawn in the DAW. Drums are usually one tick long there anyway.
  Drums:
    kind: pulse
    pulse_ms: 50
    notes:
      25: 100
      22: 101
      23: 102
    labels:          # optional, for the report
      25: Bass
      22: Snare
      23: Snare

  # Registers are set/reset latches driven by separate on and off notes: a
  # pulse to the "set" coil opens the register, a pulse to "reset" closes it.
  Registers:
    kind: pulse
    pulse_ms: 100
    notes:
      122: 104
      121: 105
      119: 106
      118: 107
    labels:
      122: Trombone on
      121: Trombone off
      119: Clarinet on
      118: Clarinet off

# The set/reset coil pairs, as slots, so the arranger can pulse every reset
# before the music starts (whatever state the registers were left in, they are
# closed now) and again after it ends.
registers:
  - { name: Trombone, set: 104, reset: 105 }
  - { name: Clarinet, set: 106, reset: 107 }

# All in milliseconds. Starting points to tune against the chest.
timing:
  min_note_ms: 50            # shorter pitched notes are stretched to this
  min_gap_ms: 30             # silence needed between two notes on one slot
  pulse_ms: 50               # default for pulse tracks that do not say
  register_pulse_ms: 100     # the arranger's own preamble/postamble resets
  register_stagger_ms: 60    # spacing between those resets
  lead_in_ms: 1000           # silence before the music, after the preamble
  settle_ms: 250             # pause after the last note before the postamble
  reset_registers_at_start: true
  reset_registers_at_end: true
