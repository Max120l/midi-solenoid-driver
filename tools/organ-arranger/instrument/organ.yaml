# Organ definition for organ_arranger.
#
# GENERATED from layout.xlsx by layout_to_organ.py -- edit the spreadsheet
# and re-run rather than editing this file, or your changes will be lost.
#
# Slots are the MIDI notes the driver boards listen for: solenoid N is slot
# 0 + N - 1. Under each track, `notes` maps the note as written on
# that track in the DAW to the slot(s) it sounds. A pulse track treats every
# note as a strike of fixed length; a pitched track keeps written durations.
# `registers` lists set/reset coil pairs so the arranger can close every
# register before and after the music.

