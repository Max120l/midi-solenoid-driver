# Organ definition for organ_arranger.
#
# GENERATED from layout.xlsx by layout_to_organ.py -- edit the spreadsheet
# and re-run rather than editing this file, or your changes will be lost.
#
# Solenoids are numbered 1 upwards, exactly as on the sheet. On the wire,
# solenoid N is MIDI note solenoid_1_note + N - 1; the arranger does that
# arithmetic, nothing else needs to. Under each track, `notes` maps the note
# as written on that track in the DAW to the solenoid(s) it sounds. A pulse
# track treats every note as a strike of fixed length; a pitched track keeps
# written durations.
# `sections` divides a pitched track into the ranks the transcriber arranges
# for. `registers` lists set/reset coil pairs so the arranger can close every
# register before and after the music.

name: layout
output_channel: 1
solenoid_1_note: 0
tracks:
  Main:
    kind: pitched
    notes: {36: 27, 41: 26, 43: 63, 46: 62, 48: 36, 50: 38, 52: 34, 53: 40, 55: 32, 57: 42, 58: 30, 59: 44,
      60: 28, 72: 41, 74: 39, 76: 43, 77: 37, 78: 45, 79: 35, 81: 47, 82: 33, 83: 49, 84: 31, 86: 51,
      88: 29, 89: 53}
    sections:
      Base: [36, 41, 43, 46]
      Accompainment: [48, 50, 52, 53, 55, 57, 58, 59, 60]
      Melody: [72, 74, 76, 77, 78, 79, 81, 82, 83, 84, 86, 88, 89]
  TenorCM:
    kind: pitched
    notes: {60: 16, 62: 61, 64: 17, 65: 60, 66: 18, 67: 59, 69: 19, 70: 58, 71: 20, 72: 57}
  TrebCM:
    kind: pitched
    notes: {84: 21, 86: 54, 88: 22, 89: 52, 90: 23, 91: 50, 93: 24, 94: 48, 95: 25, 96: 46}
  Drums:
    kind: pulse
    pulse_ms: 50
    notes: {21: 64, 35: 15, 38: 56, 39: 55}
    labels: {21: Leader, 35: Bass, 38: Snare, 39: Snare}
  Registers:
    kind: pulse
    pulse_ms: 100
    notes: {99: 14, 100: 13, 102: 12, 103: 11, 106: 10, 107: 9, 109: 8, 110: 7, 114: 6, 115: 5, 118: 4,
      119: 3, 121: 2, 122: 1}
    labels: {99: Flute Melody off, 100: Flute Melody on, 102: Violin Melody off, 103: Violin Melody on,
      106: Trumpet Melody off, 107: Trumpet Melody on, 109: Violin Accompainment off, 110: Violin Accompainment
        on, 114: Cello TenorCM off, 115: Cello TenorCM on, 118: Clarinet TenorCM off, 119: Clarinet TenorCM
        on, 121: Trombone Base off, 122: Trombone Base on}
registers:
- {name: Trombone Base, set: 1, reset: 2}
- {name: Clarinet TenorCM, set: 3, reset: 4}
- {name: Cello TenorCM, set: 5, reset: 6}
- {name: Violin Accompainment, set: 7, reset: 8}
- {name: Trumpet Melody, set: 9, reset: 10}
- {name: Violin Melody, set: 11, reset: 12}
- {name: Flute Melody, set: 13, reset: 14}
timing: {min_note_ms: 50, min_gap_ms: 30, pulse_ms: 50, register_pulse_ms: 100, register_stagger_ms: 60,
  lead_in_ms: 1000, settle_ms: 250, reset_registers_at_start: true, reset_registers_at_end: true}
